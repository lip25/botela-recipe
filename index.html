<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BOTELA Recipe Pro</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0b0b0d;color:#fff;
 font-family:Arial,sans-serif;padding:20px
}
.app{
 max-width:500px;margin:auto;
 background:#151519;padding:20px;border-radius:20px
}
h1{margin:0 0 5px;font-size:24px}
.sub{color:#888;margin-bottom:20px}
label{display:block;margin:12px 0 6px;color:#aaa}
input,select,button{
 width:100%;padding:13px;border:0;border-radius:12px;
 font-size:15px
}
input,select{background:#242429;color:#fff}
button{
 background:#fff;color:#000;font-weight:bold;
 margin-top:10px;cursor:pointer
}
.mode{
 display:flex;gap:8px
}
.mode button{margin:0;background:#242429;color:#aaa}
.mode button.active{background:#fff;color:#000}
.menu{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:8px;margin-top:15px
}
.menu button{background:#242429;color:#aaa}
.menu button.active{background:#fff;color:#000}
.card{
 background:#202025;border-radius:15px;
 padding:15px;margin-top:15px
}
.row{
 display:flex;justify-content:space-between;
 padding:7px 0;border-bottom:1px solid #333
}
.total{
 font-size:20px;font-weight:bold;margin-top:12px
}
small{color:#888}
.hidden{display:none}
</style>
</head>

<body>
<div class="app">

<h1>BOTELA Recipe Pro</h1>
<div class="sub">Kalkulator resep & HPP</div>

<div class="mode">
<button id="btnBotol" class="active" onclick="mode('botol')">
Per Botol
</button>
<button id="btnSkala" onclick="mode('skala')">
Skala Resep
</button>
</div>

<div id="botolMode">

<label>Jumlah botol</label>
<input id="jumlah" type="number" value="1" min="1">

<div class="menu">
<button onclick="hitung('americano')">Americano</button>
<button onclick="hitung('matcha')">Matcha</button>
<button onclick="hitung('kopsuren')">Kopsuren</button>
</div>

</div>

<div id="skalaMode" class="hidden">

<label>Pilih resep</label>
<select id="resep">
<option value="americano">Americano</option>
<option value="matcha">Matcha Latte</option>
<option value="kopsuren">Kopi Susu Aren</option>
</select>

<label>Target jumlah</label>
<input id="target" type="number" value="100" min="1"
placeholder="Contoh: 100, 137, 500, 1000">

<button onclick="hitungSkala()">Hitung Resep</button>

</div>

<div id="hasil"></div>

</div>

<script>
const harga={
 kopi:60000/200,
 matcha:53000/1000,
 uht:23000/1000,
 skm:14000/500,
 creamer:60000/1000,
 aren:20000/250,
 nescafe:25000/45
};

const resep={

americano:{
 nama:"Americano",
 base:250,
 bahan:[
 ["Kopi Gayo",25,"g",harga.kopi],
 ["Air",250,"ml",0]
 ]
},

matcha:{
 nama:"Matcha Latte",
 base:250,
 bahan:[
 ["Matcha",25,"g",harga.matcha],
 ["SKM",4,"ml",harga.skm],
 ["UHT Full Cream",150,"ml",harga.uht],
 ["Air panas",80,"ml",0]
 ]
},

kopsuren:{
 nama:"Kopi Susu Aren",
 base:250,
 bahan:[
 ["Ekstrak kopi",35,"ml",(20*harga.kopi)/120],
 ["UHT Full Cream",120,"ml",harga.uht],
 ["Creamer",10,"g",harga.creamer],
 ["Gula aren",30,"ml",harga.aren],
 ["Air",65,"ml",0]
 ]
}

};

function rupiah(n){
 return "Rp"+Math.round(n).toLocaleString("id-ID");
}

function mode(x){

 document.getElementById("botolMode")
 .classList.toggle("hidden",x!=="botol");

 document.getElementById("skalaMode")
 .classList.toggle("hidden",x!=="skala");

 document.getElementById("btnBotol")
 .classList.toggle("active",x==="botol");

 document.getElementById("btnSkala")
 .classList.toggle("active",x==="skala");

 document.getElementById("hasil").innerHTML="";
}

function hitung(menu){

 const j=+document.getElementById("jumlah").value;
 const r=resep[menu];

 let isi="";
 let hpp=0;

 r.bahan.forEach(b=>{
   const qty=b[1]*j;
   const biaya=qty*b[3];

   hpp+=biaya;

   isi+=`
   <div class="row">
   <span>${b[0]}<br><small>${qty} ${b[2]}</small></span>
   <b>${rupiah(biaya)}</b>
   </div>`;
 });

 const kemasan=900+350;
 hpp+=kemasan*j;

 document.getElementById("hasil").innerHTML=`
 <div class="card">
 <h2>${r.nama}</h2>
 ${isi}
 <div class="row">
 <span>Kemasan × ${j}</span>
 <b>${rupiah(kemasan*j)}</b>
 </div>
 <div class="total">
 Total HPP: ${rupiah(hpp)}
 </div>
 <small>HPP per botol: ${rupiah(hpp/j)}</small>
 </div>`;
}

function hitungSkala(){

 const menu=document.getElementById("resep").value;
 const target=+document.getElementById("target").value;
 const r=resep[menu];

 if(!target||target<=0)return;

 const skala=target/r.base;

 let isi="";
 let total=0;

 r.bahan.forEach(b=>{

   const qty=b[1]*skala;
   const biaya=qty*b[3];

   total+=biaya;

   isi+=`
   <div class="row">
   <span>${b[0]}<br>
   <small>${formatQty(qty)} ${b[2]}</small>
   </span>
   <b>${rupiah(biaya)}</b>
   </div>`;
 });

 document.getElementById("hasil").innerHTML=`
 <div class="card">
 <h2>${r.nama}</h2>
 <small>Target: ${formatQty(target)} ml</small>
 ${isi}
 <div class="total">
 HPP bahan: ${rupiah(total)}
 </div>
 </div>`;
}

function formatQty(n){

 if(Number.isInteger(n))return n;

 return Number(n.toFixed(2));
}
</script>
</body>
    </html>
