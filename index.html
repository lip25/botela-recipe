<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botela Recipe - Production System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #1e293b;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #22c55e;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #334155;
            border-radius: 12px;
            background: #0f172a;
            color: white;
            font-size: 16px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #22c55e;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #22c55e;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: #16a34a;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-americano { background: #334155; }
        .btn-americano:hover { background: #475569; }

        .btn-matcha { background: #334155; }
        .btn-matcha:hover { background: #475569; }

        .btn-kopisusu { background: #334155; }
        .btn-kopisusu:hover { background: #475569; }

        /* Tombol aktif/utama */
        button.primary {
            background: #22c55e;
        }
        button.primary:hover {
            background: #16a34a;
        }

        .result {
            background: #0f172a;
            padding: 20px;
            border-radius: 16px;
            text-align: left;
            line-height: 1.8;
            font-size: 15px;
            border: 1px solid #334155;
        }

        .result h2 {
            color: #22c55e;
            text-align: center;
            font-size: 20px;
            margin-bottom: 12px;
        }

        .row-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .highlight {
            color: #22c55e;
            font-weight: 600;
        }

        .divider {
            height: 1px;
            background: #334155;
            margin: 12px 0;
        }

        .footer {
            margin-top: 24px;
            color: #64748b;
            font-size: 12px;
            text-align: center;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>BOTELA RECIPE</h1>
        <div class="subtitle">250ml • Hemat HPP System</div>

        <div class="input-group">
            <input type="number" id="botol" placeholder="Masukkan jumlah botol" min="1">
        </div>

        <div class="menu-buttons">
            <button class="btn-americano" onclick="hitung('americano')">☕ Americano</button>
            <button class="btn-matcha" onclick="hitung('matcha')">🍵 Matcha</button>
            <button class="btn-kopisusu" onclick="hitung('kopisusu')">🥛 Kopi Susu Gula Aren</button>
        </div>

        <div class="result" id="hasil" style="text-align: center; color: #94a3b8;">
            Masukkan jumlah botol lalu pilih menu di atas.
        </div>

        <div class="footer">
            BOTELA • PRODUCTION SYSTEM v1.0
        </div>
    </div>

    <script>
        function hitung(menu) {
            let botol = parseInt(document.getElementById("botol").value);

            if (!botol || botol <= 0) {
                document.getElementById("hasil").innerHTML = `
                    <h2 style="color: #ef4444;">⚠️ Perhatian</h2>
                    <p style="text-align: center; color: #cbd5e1;">Silakan masukkan jumlah botol yang valid terlebih dahulu.</p>
                `;
                return;
            }

            let hasil = "";

            if (menu === "americano") {
                let kopi = botol * 4;
                let air = botol * 250;
                let hpp = botol * 2500;

                hasil = `
                    <h2>☕ Americano</h2>
                    <div class="row-item"><span>Jumlah Botol:</span> <span class="highlight">${botol} pcs</span></div>
                    <div class="divider"></div>
                    <div class="row-item"><span>Nescafe:</span> <span class="highlight">${kopi} gram</span></div>
                    <div class="row-item"><span>Air Dingin:</span> <span class="highlight">${air} ml</span></div>
                    <div class="divider"></div>
                    <div class="row-item"><span>Total HPP:</span> <span class="highlight">Rp ${hpp.toLocaleString('id-ID')}</span></div>
                    <div class="row-item"><span>HPP / Botol:</span> <span class="highlight">Rp 2.500</span></div>
                    <div style="text-align: center; margin-top: 15px; color: #38bdf8; font-size: 14px;">✨ Clean • Strong • Low Cost</div>
                `;
            } else if (menu === "matcha") {
                let matcha = botol * 23;
                let susu = botol * 150;
                let skm = botol * 3;
                let air = botol * 75;
                let hpp = botol * 5700;

                hasil = `
                    <h2>🍵 Matcha</h2>
                    <div class="row-item"><span>Jumlah Botol:</span> <span class="highlight">${botol} pcs</span></div>
                    <div class="divider"></div>
                    <div class="row-item"><span>Matcha Mix:</span> <span class="highlight">${matcha} gram</span></div>
                    <div class="row-item"><span>Susu UHT:</span> <span class="highlight">${susu} ml</span></div>
                    <div class="row-item"><span>SKM:</span> <span class="highlight">${skm} gram</span></div>
                    <div class="row-item"><span>Air Panas:</span> <span class="highlight">${air} ml</span></div>
                    <div class="divider"></div>
                    <div class="row-item"><span>Total HPP:</span> <span class="highlight">Rp ${hpp.toLocaleString('id-ID')}</span></div>
                    <div class="row-item"><span>HPP / Botol:</span> <span class="highlight">Rp 5.700</span></div>
                    <div style="text-align: center; margin-top: 15px; color: #38bdf8; font-size: 14px;">✨ Creamy Matcha Signature</div>
                `;
            } else if (menu === "kopisusu") {
                let kopi = botol * 40;
                let susu = botol * 120;
                let creamer = botol * 10;
                let gula = botol * 25;
                let air = botol * 68;
                let hpp = botol * 7860;

                hasil = `
                    <h2>🥛 Kopi Susu Gula Aren</h2>
                    <div class="row-item"><span>Jumlah Botol:</span> <span class="highlight">${botol} pcs</span></div>
                    <div class="divider"></div>
                    <div class="row-item"><span>Ekstrak Kopi:</span> <span class="highlight">${kopi} ml</span></div>
                    <div class="row-item"><span>Susu UHT:</span> <span class="highlight">${susu} ml</span></div>
                    <div class="row-item"><span>Creamer:</span> <span class="highlight">${creamer} gram</span></div>
                    <div class="row-item"><span>Gula Aren:</span> <span class="highlight">${gula} ml</span></div>
                    <div class="row-item"><span>Air:</span> <span class="highlight">${air} ml</span></div>
                    <div class="divider"></div>
                    <div class="row-item"><span>Total HPP:</span> <span class="highlight">Rp ${hpp.toLocaleString('id-ID')}</span></div>
                    <div class="row-item"><span>HPP / Botol:</span> <span class="highlight">Rp 7.860</span></div>
                    <div style="text-align: center; margin-top: 15px; color: #38bdf8; font-size: 14px;">✨ Coffee Milk Signature</div>
                `;
            }

            document.getElementById("hasil").innerHTML = hasil;
        }
    </script>
</body>
</html>
