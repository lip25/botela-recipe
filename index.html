<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botela Recipe - Production System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        h1 {
            color: #22c55e;
            margin-bottom: 8px;
            font-size: 32px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 25px;
            font-size: 15px;
        }

        input {
            width: 100%;
            padding: 16px;
            border: 2px solid #334155;
            border-radius: 14px;
            background: #1e293b;
            color: white;
            font-size: 18px;
            text-align: center;
            margin-bottom: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #22c55e;
        }

        button {
            width: 100%;
            padding: 16px;
            margin-bottom: 12px;
            border: none;
            border-radius: 14px;
            background: #22c55e;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: #16a34a;
        }

        button:active {
            transform: scale(0.98);
        }

        .option-btn {
            background: #334155;
        }

        .option-btn:hover {
            background: #475569;
        }

        .result {
            margin-top: 20px;
            background: #1e293b;
            padding: 25px;
            border-radius: 18px;
            text-align: left;
            line-height: 1.8;
            font-size: 16px;
            border: 1px solid #334155;
        }

        .result h2 {
            color: #22c55e;
            text-align: center;
            margin-bottom: 15px;
        }

        .highlight {
            color: #22c55e;
            font-weight: bold;
        }

        .error-title {
            color: #ef4444 !important;
        }

        .footer {
            margin-top: 25px;
            color: #64748b;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>BOTELA RECIPE</h1>
        <div class="subtitle">
            250ml • Hemat HPP System
        </div>

        <input type="number" id="botol" placeholder="Masukkan jumlah botol" min="1">

        <button onclick="hitung('americano')">☕ Americano</button>
        <button onclick="hitung('matcha')">🍵 Matcha</button>
        <button onclick="hitung('kopisusu')">🥛 Kopi Susu Gula Aren</button>

        <div class="result" id="hasil">
            Masukkan jumlah botol lalu pilih menu di atas.
        </div>

        <div class="footer">
            BOTELA • Production System &copy; 2026
        </div>
    </div>

    <script>
        function hitung(menu) {
            let botol = Number(document.getElementById("botol").value);
            let hasil = "";

            if (!botol || botol <= 0) {
                document.getElementById("hasil").innerHTML = `
                    <h2 class="error-title">⚠️ Peringatan</h2>
                    <center>Silakan masukkan jumlah botol terlebih dahulu dengan benar!</center>
                `;
                return;
            }

            if (menu === "americano") {
                let kopi = botol * 4;
                let air = botol * 250;
                let hpp = botol * 2500;

                hasil = `
                    <h2>☕ Americano</h2>
                    Jumlah botol: <span class="highlight">${botol}</span><br><br>
                    Nescafe: <span class="highlight">${kopi} gram</span><br>
                    Air dingin: <span class="highlight">${air} ml</span><br><br>
                    Total HPP: <span class="highlight">Rp ${hpp.toLocaleString('id-ID')}</span><br>
                    HPP / botol: <span class="highlight">Rp 2.500</span><br><br>
                    ✨ <em>Clean • Strong • Low Cost</em>
                `;
            } else if (menu === "matcha") {
                let matcha = botol * 23;
                let susu = botol * 150;
                let skm = botol * 3;
                let air = botol * 75;
                let hpp = botol * 5700;

                hasil = `
                    <h2>🍵 Matcha</h2>
                    Jumlah botol: <span class="highlight">${botol}</span><br><br>
                    Matcha Mix: <span class="highlight">${matcha} gram</span><br>
                    Susu UHT: <span class="highlight">${susu} ml</span><br>
                    SKM: <span class="highlight">${skm} gram</span><br>
                    Air panas: <span class="highlight">${air} ml</span><br><br>
                    Total HPP: <span class="highlight">Rp ${hpp.toLocaleString('id-ID')}</span><br>
                    HPP / botol: <span class="highlight">Rp 5.700</span><br><br>
                    ✨ <em>Creamy Matcha</em>
                `;
            } else if (menu === "kopisusu") {
                let kopi = botol * 40;
                let susu = botol * 120;
                let creamer = botol * 10;
                let gula = botol * 25;
                let air = botol * 68;
                let hpp = botol * 7860;

                hasil = `
                    <h2>🥛 Kopi Susu Gula Aren</h2>
                    Jumlah botol: <span class="highlight">${botol}</span><br><br>
                    Ekstrak kopi: <span class="highlight">${kopi} ml</span><br>
                    Susu UHT: <span class="highlight">${susu} ml</span><br>
                    Creamer: <span class="highlight">${creamer} gram</span><br>
                    Gula aren: <span class="highlight">${gula} ml</span><br>
                    Air: <span class="highlight">${air} ml</span><br><br>
                    Total HPP: <span class="highlight">Rp ${hpp.toLocaleString('id-ID')}</span><br>
                    HPP / botol: <span class="highlight">Rp 7.860</span><br><br>
                    ✨ <em>Coffee Milk Signature</em>
                `;
            }

            document.getElementById("hasil").innerHTML = hasil;
        }
    </script>
</body>
</html>
