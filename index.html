<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Botela Recipe Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(148, 163, 184, 0.2);
            --primary: #22c55e;
            --primary-hover: #16a34a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success-soft: rgba(34, 197, 94, 0.15);
            --radius-xl: 24px;
            --radius-lg: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 10% 10%, rgba(34, 197, 94, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(30, 58, 138, 0.2) 0px, transparent 50%);
            color: var(--text-main);
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.6;
        }

        .main-container {
            width: 100%;
            max-width: 480px;
            margin-top: 20px;
            margin-bottom: 40px;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        header h1 {
            font-size: 36px;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 2px 10px rgba(34, 197, 94, 0.3);
        }

        header p {
            color: var(--text-muted);
            font-size: 16px;
        }

        .input-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.3);
        }

        .label-group {
            text-align: left;
            margin-bottom: 15px;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .label-group i {
            color: var(--primary);
        }

        input[type="number"] {
            width: 100%;
            padding: 18px 20px;
            border: 2px solid transparent;
            border-radius: var(--radius-lg);
            background: #0f172a;
            color: white;
            font-size: 18px;
            font-family: 'Poppins', sans-serif;
            text-align: center;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--primary);
            background: #1e293b;
            box-shadow: 0 0 0 4px var(--success-soft);
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        button {
            width: 100%;
            padding: 16px 20px;
            border: none;
            border-radius: var(--radius-lg);
            font-size: 16px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
        }

        .btn-secondary {
            background: #334155;
            color: var(--text-main);
            border: 1px solid transparent;
        }

        .btn-secondary:hover {
            background: #475569;
            border-color: rgba(255,255,255,0.1);
        }

        .result-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 30px;
            text-align: left;
            line-height: 1.8;
            font-size: 16px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
            display: none;
        }

        .result-card.show {
            opacity: 1;
            transform: translateY(0);
            display: block;
        }

        .result-header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--success-soft);
        }

        .result-header h2 {
            color: var(--primary);
            font-size: 24px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .ingredient-list, .cost-list {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .item-row:last-child {
            border-bottom: none;
        }

        .item-name { color: var(--text-muted); }
        
        .item-value { 
            color: var(--text-main); 
            font-weight: 600;
            text-align: right;
        }

        .highlight {
            color: var(--primary);
            font-weight: 700;
            font-size: 1.1em;
        }

        .total-cost-row {
            margin-top: 10px;
            padding-top: 15px;
            border-top: 2px dashed var(--border-color);
            font-size: 18px;
        }

        .tagline {
            text-align: center;
            font-style: italic;
            color: var(--text-muted);
            margin-top: 20px;
            font-size: 14px;
        }

        footer {
            margin-top: auto;
            color: #475569;
            font-size: 13px;
        }

        @media (max-width: 400px) {
            header h1 { font-size: 28px; }
            .input-card, .result-card { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <header>
            <h1>Botela</h1>
            <p>Production Recipe Calculator</p>
        </header>

        <div class="input-card">
            <div class="label-group">
                <span><i class="fas fa-box-open"></i> Jumlah Produksi</span>
                <span id="bottle-label" style="color:var(--text-muted); font-size:14px;"></span>
            </div>
            <input type="number" id="botol" placeholder="Cth: 50" min="1" inputmode="numeric">

            <div class="label-group">
                <span><i class="fas fa-receipt"></i> Pilih Menu</span>
            </div>
            <div class="btn-group">
                <button class="btn-secondary" onclick="hitung('americano')">
                    <i class="fas fa-coffee"></i> Americano
                </button>
                <button class="btn-secondary" onclick="hitung('matcha')">
                    <i class="fas fa-leaf"></i> Matcha Latte
                </button>
                <button class="btn-primary" onclick="hitung('kopisusu')">
                    <i class="fas fa-mug-hot"></i> Kopi Susu Aren
                </button>
            </div>
        </div>

        <div class="result-card" id="hasilContainer"></div>

        <div class="tagline">"Konsistensi Rasa, Efisiensi Biaya"</div>
    </div>

    <footer>
        BOTELA System &copy; 2026
    </footer>

    <script>
        const inputBotol = document.getElementById('botol');
        const bottleLabel = document.getElementById('bottle-label');
        inputBotol.addEventListener('input', function() {
            if(this.value > 0) {
                bottleLabel.textContent = `${this.value} Botol @250ml`;
            } else {
                bottleLabel.textContent = '';
            }
        });

        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(angka);
        }

        function hitung(menu) {
            const botolInput = document.getElementById("botol");
            const botol = parseInt(botolInput.value);
            const container = document.getElementById("hasilContainer");

            if (!botol || botol <= 0) {
                container.innerHTML = `
                    <div class="result-header">
                        <h2 style="color: #ef4444;"><i class="fas fa-exclamation-triangle"></i> Error</h2>
                    </div>
                    <p style="text-align:center; color:white;">Masukkan jumlah botol yang valid (minimal 1).</p>
                `;
                container.classList.add('show');
                botolInput.focus();
                return;
            }

            let data = {};

            if (menu === "americano") {
                data = {
                    title: "Americano",
                    icon: "fa-coffee",
                    ingredients: [
                        { name: "Nescafe Classic", qty: botol * 4, unit: "gram" },
                        { name: "Air Dingin", qty: botol * 250, unit: "ml" }
                    ],
                    hppPerBotol: 2500
                };
            } else if (menu === "matcha") {
                data = {
                    title: "Matcha Latte",
                    icon: "fa-leaf",
                    ingredients: [
                        { name: "Matcha Powder", qty: botol * 23, unit: "gram" },
                        { name: "Susu UHT", qty: botol * 150, unit: "ml" },
                        { name: "SKM", qty: botol * 3, unit: "gram" },
                        { name: "Air Panas", qty: botol * 75, unit: "ml" }
                    ],
                    hppPerBotol: 5700
                };
            } else if (menu === "kopisusu") {
                data = {
                    title: "Kopi Susu Gula Aren",
                    icon: "fa-mug-hot",
                    ingredients: [
                        { name: "Ekstrak Kopi", qty: botol * 40, unit: "ml" },
                        { name: "Susu UHT", qty: botol * 120, unit: "ml" },
                        { name: "Krimer", qty: botol * 10, unit: "gram" },
                        { name: "Larutan Gula Aren", qty: botol * 25, unit: "ml" },
                        { name: "Air Tambahan", qty: botol * 68, unit: "ml" }
                    ],
                    hppPerBotol: 7860
                };
            }

            const totalHpp = botol * data.hppPerBotol;

            let ingredientsHtml = data.ingredients.map(item => `
                <div class="item-row">
                    <span class="item-name">${item.name}</span>
                    <span class="item-value">${item.qty.toLocaleString('id-ID')} ${item.unit}</span>
                </div>
            `).join('');

            container.innerHTML = `
                <div class="result-header">
                    <h2><i class="fas ${data.icon}"></i> ${data.title}</h2>
                    <p>Untuk ${botol} Botol (250ml)</p>
                </div>

                <div class="ingredient-list">
                    <div class="section-title">Kebutuhan Bahan Baku</div>
                    ${ingredientsHtml}
                </div>

                <div class="cost-list">
                    <div class="section-title">Estimasi Biaya</div>
                    <div class="item-row">
                        <span class="item-name">HPP per Botol</span>
                        <span class="item-value">${formatRupiah(data.hppPerBotol)}</span>
                    </div>
                    <div class="item-row total-cost-row highlight">
                        <span class="item-name">Total Estimasi HPP</span>
                        <span class="item-value">${formatRupiah(totalHpp)}</span>
                    </div>
                </div>
            `;

            container.classList.add('show');
        }
    </script>
</body>
</html>
